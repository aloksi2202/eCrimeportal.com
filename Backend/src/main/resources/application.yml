spring:

  application:
    name: Backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecrimeportaldb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect



  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:replace-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:replace-me}
# Sensitive values are provided through environment variables, not committed files.
app:
  jwt:
    secret: ${JWT_SECRET:}

news:
  api:
    key: ${NEWS_API_KEY:}
